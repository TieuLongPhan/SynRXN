[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synrxn"
version = "1.5.0"
authors = [
    { name = "Tieu Long Phan", email = "tieu@bioinf.uni-leipzig.de" }
]
description = "Source-qualified reaction datasets, task metrics, split protocols and reproducible reconstruction."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
  "numpy>=2.2.0",
  "pandas>=1.5.3",
  "PyYAML>=6.0",
  "requests>=2.31.0",
  "synkit>=1.5.0",
  "scikit-learn>=1.7.2",
]

[project.scripts]
synrxn = "synrxn.__main__:main"
synrxn-service = "synrxn.access.service:main"

[project.optional-dependencies]
expansion = [
  "pyarrow>=20.0.0",
  "openpyxl>=3.1.5",
  "h5py>=3.10.0",
  "ord-schema>=0.9.5",
  "ijson>=3.3.0",
]

all = [
  "duckdb>=1.3.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pyarrow>=20.0.0",
  "scikit-posthocs>=0.11.4",
  "scipy>=1.16.2",
  "seaborn>=0.13.0",
  "statsmodels>=0.14.0",
  "synrbl>=1.0.4",
  "openpyxl>=3.1.5",
  "h5py>=3.10.0",
  "ord-schema>=0.9.5",
  "ijson>=3.3.0",
  "uvicorn>=0.34.0",
]

maintenance = [
  "openpyxl>=3.1.5",
  "ord-schema>=0.8.3",
  "pyarrow>=20.0.0",
]

dev = [
  "build>=1.2.0",
  "flake8>=7.0.0",
  "hatchling>=1.25.0",
  "pytest>=8.0.0",
  "PyYAML>=6.0",
  "httpx>=0.28.0"
]

query = [
  "duckdb>=1.3.0",
  "pyarrow>=20.0.0"
]

service = [
  "duckdb>=1.3.0",
  "fastapi>=0.115.0",
  "pyarrow>=20.0.0",
  "uvicorn>=0.34.0",
  "httpx>=0.28.0"
]

docs = [
  "sphinx>=6.0",
  "sphinx-rtd-theme",
  "sphinxcontrib-bibtex",
  "sphinx_copybutton",
  "pydata_sphinx_theme",
]

[project.urls]
homepage = "https://github.com/TieuLongPhan/synrxn"
source = "https://github.com/TieuLongPhan/synrxn"
issues = "https://github.com/TieuLongPhan/synrxn/issues"
documentation = "https://synrxn.readthedocs.io/en/latest/"

# ------------------------------
# Hatch build configuration
# ------------------------------
# Tell hatch explicitly which package(s) to include in the wheel. Adjust
# the value of `packages` to match your repository layout (see notes below).
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
# If your package lives at the top-level as `synrxn/`, use:
packages = ["synrxn"]
# Include extra top-level files in the wheel (useful when metadata references them)
include = [
  "README.md",
  "LICENSE",
  "manifest.schema.json",
]

[tool.hatch.build.targets.wheel.force-include]
"manifest.schema.json" = "synrxn/manifest.schema.json"
"Data/metadata/catalog.yaml" = "synrxn/data/metadata.yaml"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "synrxn",
  "scripts",
  "Test",
  "CITATION.cff",
  "manifest.json",
  "doc",
  "Data/metadata/sharealike-manifest.json",
  "Data/metadata/catalog.yaml",
  "README.md",
  "LICENSE",
  "manifest.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["Test"]
addopts = "--import-mode=importlib"

[tool.synrxn.quality]
max-python-lines = 1000

# Existing modules may shrink, but cannot grow beyond these measured sizes.
[tool.synrxn.quality.file-size-baseline]
"synrxn/data/build_manifest.py" = 1148
"synrxn/reconstruction/families/conditions/condition_recovery/_normalize.py" = 1094
