schema_version: '1.0'
column_definitions:
  r_id:
    role: identifier
    description: Stable row identifier supplied by SynRXN.
  original_id:
    role: source_identifier
    description: Identifier in the upstream dataset.
  center_cluster_id:
    role: group
    description: Global exact center class shared across source roles and step counts.
  center_type:
    role: provenance
    description: RC for an elementary representative or MC for a multistep representative.
  parent_r_id:
    role: group
    description: Parent reaction record identifier; all derived missing-component cases share its split.
  case_type:
    role: provenance
    description: Missing heavy-component side in a derived balancing case, reactant, product or both.
  orig_index:
    role: source_identifier
    description: Row index in the upstream dataset.
  rxn:
    role: reaction
    description: Reaction SMILES string.
  reactions:
    role: reaction
    description: Reaction SMILES string retained under the upstream plural field name.
  aam:
    role: reaction
    description: Atom-mapped reaction SMILES.
  ground_truth:
    role: reference
    description: Curated reference reaction or atom mapping.
  gt_rxn:
    role: reference
    description: Complete reference reaction without atom maps; the target for reaction balancing.
  gt_aam:
    role: reference
    description: Complete atom-mapped reference reaction, preserved from the parent mapping source.
  base_r_id:
    role: source_identifier
    description: Exact case identifier in the base balancing dataset before context augmentation.
  variant:
    role: provenance
    description: Dataset construction variant, such as a harder native-context balancing case.
  has_context:
    role: quality
    description: Whether recovered native heavy-atom context was added to the hard input.
  context_rxn:
    role: provenance
    description: Unmapped unchanged source-mixture components carried through both hard target sides.
  context_aam:
    role: provenance
    description: Recovered source-mixture components with their original atom-map IDs.
  input_context_rxn:
    role: provenance
    description: Heavy-atom context added only to the reactant side of the hard input.
  ground_truth_variants:
    role: reference
    description: JSON source mapping candidates retained per dataset case; endpoint tautomer forms may differ.
  rxn_mapper:
    role: prediction
    description: Mapping predicted by RXNMapper.
  graphormer:
    role: prediction
    description: Mapping predicted by Graphormer.
  local_mapper:
    role: prediction
    description: Mapping predicted by LocalMapper.
  rdt:
    role: prediction
    description: Mapping predicted by RDT.
  label:
    role: target
    description: Reaction class or template label.
  label_0:
    role: target
    description: Top-level hierarchical template label.
  label_1:
    role: target
    description: Second-level hierarchical template label.
  label_2:
    role: target
    description: Third-level hierarchical template label.
  ec1:
    role: target
    description: First Enzyme Commission hierarchy level.
  ec2:
    role: target
    description: Second Enzyme Commission hierarchy level.
  ec3:
    role: target
    description: Third Enzyme Commission hierarchy level.
  ea:
    role: target
    description: Activation-energy target; consult the upstream record for units.
  dh:
    role: target
    description: Reaction-enthalpy target; consult the upstream record for units.
  G_act:
    role: target
    description: Activation free-energy target; consult the upstream record for units.
  G_r:
    role: target
    description: Reaction free-energy target; consult the upstream record for units.
  lograte:
    role: target
    description: Logarithmic reaction-rate target.
  Conversion:
    role: target
    description: Reaction conversion target.
  onehot:
    role: feature
    description: Upstream one-hot encoded reaction context.
  split:
    role: partition
    description: Upstream training, validation, or test assignment.
  code:
    role: source_identifier
    description: Upstream reaction code.
  reaction_original:
    role: reaction
    description: Original upstream reaction representation.
  reaction:
    role: reaction
    description: Processed reaction representation.
  rsmi:
    role: reaction
    description: Reaction SMILES representation.
  reagent:
    role: target
    description: Reagent or catalyst target.
  source:
    role: provenance
    description: Upstream source or subset marker.
  rc:
    role: target
    description: Reaction-center annotation.
  reaction_r_id:
    role: identifier
    description: Identifier of the corresponding reaction-level record.
  system:
    role: partition
    description: EHreact enzyme or reaction system.
  input:
    role: feature
    description: Upstream query substrate or product representation.
  input_type:
    role: provenance
    description: Whether the upstream query represents a substrate or product.
  assay_labels:
    role: target
    description: JSON object containing all binary assay labels for a reaction.
  n_assays:
    role: summary
    description: Number of assay labels associated with the reaction.
  n_active:
    role: summary
    description: Number of positive assay labels associated with the reaction.
  mapping_curated:
    role: provenance
    description: Dataset-level indicator that the atom mapping underwent upstream manual curation.
  validated:
    role: provenance
    description: Row-level independent-validation status when provided by the upstream source.
  assay:
    role: target
    description: Upstream assay or enzyme label.
  activity:
    role: target
    description: Binary reaction-assay activity label.
  pubmed_ids:
    role: provenance
    description: JSON array of PubMed identifiers linked by the upstream source.
  n_steps:
    role: summary
    description: Minimum number of elementary transitions connecting the composite reaction
      states.
  sample_id:
    role: identifier
    description: Stable SynRXN identifier for a normalized record.
  dataset:
    role: provenance
    description: Normalized SynRXN dataset name.
  source_record_id:
    role: source_identifier
    description: Identifier retained from the upstream record.
  source_index:
    role: source_identifier
    description: Zero-based position of the record in the upstream table.
  raw_reaction_smiles:
    role: provenance
    description: Reaction SMILES exactly as supplied by the upstream source.
  reaction_smiles:
    role: reaction
    description: Recorded or normalized reaction SMILES with reactants, optional middle-field
      agents, and products.
  canonical_reaction_smiles:
    role: reaction
    description: Canonicalized reaction SMILES used for chemical grouping when canonicalization
      succeeds.
  reactants:
    role: reaction
    description: Reactant side of the normalized reaction SMILES.
  reagents:
    role: target
    description: Order-invariant dot-separated set of molecules explicitly annotated or conservatively
      inferred as reagents.
  products:
    role: reaction
    description: Product side of the normalized reaction SMILES.
  yield_pct:
    role: target
    description: Reported reaction yield on a validated 0 to 100 percent scale.
  yield_measurement_type:
    role: provenance
    description: Upstream yield type or normalized measurement category.
  measurement_method:
    role: provenance
    description: Experimental or analytical method used to determine the yield.
  temperature_c:
    role: feature
    description: Reaction temperature in degrees Celsius when reported.
  time_hours:
    role: feature
    description: Reaction duration in hours when reported.
  solvent:
    role: feature
    description: Solvent or solvent mixture reported for the reaction.
  catalyst:
    role: feature
    description: Catalyst or catalyst system reported for the reaction.
  base:
    role: feature
    description: Base reported for the reaction.
  selectivity:
    role: target
    description: Numeric product-selectivity measurement when the upstream value is quantitative.
  mass_ion_count:
    role: feature
    description: HiTEA mass-ion count retained from the upstream analytical record.
  reaction_class:
    role: provenance
    description: Upstream reaction class or campaign label.
  screen_id:
    role: provenance
    description: Identifier of the upstream high-throughput experiment screen.
  notebook_id:
    role: provenance
    description: Identifier of the upstream experiment notebook.
  upstream_split:
    role: partition
    description: Published upstream partition label retained without treating it as a universal
      SynRXN split.
  citation:
    role: provenance
    description: Upstream citation label embedded in the normalized record.
  license_spdx:
    role: provenance
    description: SPDX identifier for the upstream dataset license.
  license_url:
    role: provenance
    description: URL of the upstream dataset license.
  provenance:
    role: provenance
    description: Human-readable description of the pinned upstream source snapshot.
  duplicate_group:
    role: partition
    description: Stable hash grouping records with the same normalized experiment representation.
  chemical_split_group:
    role: partition
    description: Stable hash grouping records by normalized chemical transformation independently
      of yield.
  conditions_json:
    role: context
    description: Compact JSON preserving structured operating conditions beyond the normalized
      scalar columns.
  source_metadata_json:
    role: provenance
    description: JSON object preserving additional upstream fields and unnormalized values.
  agents:
    role: target
    description: Order-invariant dot-separated set of generic ORDerly agent molecules; no
      catalyst or reagent subclass is inferred.
  catalysts:
    role: target
    description: Order-invariant dot-separated set of explicitly annotated catalyst molecules.
  ligands:
    role: target
    description: Order-invariant dot-separated set of explicitly annotated ligand molecules.
  bases:
    role: target
    description: Order-invariant dot-separated set of explicitly annotated base molecules.
  additives:
    role: target
    description: Order-invariant dot-separated set of explicitly annotated additive molecules.
  agent_1:
    role: target
    description: First generic agent slot retained from ORDerly.
  agent_2:
    role: target
    description: Second generic agent slot retained from ORDerly when present.
  agent_3:
    role: target
    description: Third generic agent slot retained from ORDerly when present.
  solvents:
    role: target
    description: Order-invariant dot-separated set of solvent molecules.
  solvent_1:
    role: target
    description: First solvent slot retained from ORDerly.
  solvent_2:
    role: target
    description: Second solvent slot retained from ORDerly when present.
  temperature_plausible:
    role: quality
    description: Whether a reported temperature is within the documented pilot range of -196
      to 500 degrees Celsius.
  reported_yield:
    role: context
    description: Optional upstream yield retained as context without clipping or treating
      it as the condition benchmark target.
  yield_valid_0_100:
    role: quality
    description: Whether the optional upstream yield lies in the inclusive 0 to 100 range.
  condition_completeness:
    role: quality
    description: Fraction of declared reagent, solvent, temperature, and time slots that are
      populated.
  condition_mask_json:
    role: quality
    description: JSON presence mask distinguishing populated from missing condition slots.
  action_sequence:
    role: target
    description: Structured experimental action sequence for procedure prediction.
  action_score:
    role: quality
    description: Upstream confidence score for a machine-extracted experimental action sequence.
  pressure_bar:
    role: target
    description: Reported reaction pressure converted to bar when the source unit is supported.
  atmosphere:
    role: target
    description: Reported reaction atmosphere.
  stirring:
    role: target
    description: Reported stirring mode.
  flow:
    role: target
    description: Reported flow-reactor mode.
  photochemistry:
    role: target
    description: Reported illumination mode for photochemical reactions.
  electrochemistry:
    role: target
    description: Indicator that structured electrochemical conditions were reported.
  synrxn_split:
    role: partition
    description: Deterministic SynRXN split grouped by normalized chemical transformation;
      distinct from any upstream split.
  procedure_details:
    role: provenance
    description: Upstream reaction procedure text.
  date_of_experiment:
    role: provenance
    description: Upstream experiment date when supplied.
  grant_date:
    role: partition
    description: Patent grant date retained for temporal splitting.
  source_dataset_id:
    role: provenance
    description: ORD dataset identifier from which the ORDerly row was extracted.
  condition_group:
    role: partition
    description: Grouping key for reagent, solvent, temperature, and time contexts.
  substrate_smiles:
    role: feature
    description: Upstream substrate representation; atom indices refer to this string when
      site labels are supplied.
  canonical_substrate_smiles:
    role: feature
    description: Canonical substrate for identity grouping; upstream site indices retain their
      original namespace.
  candidate_site_indices:
    role: feature
    description: Semicolon-separated zero-based candidate atom indices in the upstream substrate
      SMILES.
  observed_site_indices:
    role: target
    description: Semicolon-separated experimentally observed reactive atom indices in the
      upstream substrate SMILES.
  observed_site_count:
    role: summary
    description: Number of experimentally observed reactive sites in the record.
  site_index_basis:
    role: provenance
    description: Explicit convention defining which molecular representation and index origin
      the site labels use.
  selectivity_value:
    role: target
    description: Quantitative selectivity measurement retained without changing its upstream
      sign convention.
  selectivity_type:
    role: provenance
    description: Selectivity target class such as enantiomeric excess or an observed regioselective
      site set.
  selectivity_unit:
    role: provenance
    description: Source target unit, including percent ee or an atom-site index.
  selectivity_sign_convention:
    role: provenance
    description: Source sign convention, or not applicable for site labels.
  stereochemistry_complete:
    role: quality
    description: Whether the structure and measurement identify the favored stereoisomer completely.
  reported_yield_pct:
    role: context
    description: Optional experimental yield or recovery retained as context rather than as
      the selectivity target.
  reference:
    role: provenance
    description: Literature reference, patent identifier, or upstream accession.
  feasible:
    role: target
    description: Binary source feasibility label; consult evidence_tier for its meaning.
  evidence_tier:
    role: provenance
    description: Expert judgment, upstream-positive record, or generated-negative supervision.
  exact_reaction_group:
    role: group
    description: SHA-256 group of exact recorded reaction text, without a chemical-independence
      claim.
  negative_method:
    role: provenance
    description: Upstream generation method; withheld from feasibility model inputs.
  electron_path_json:
    role: target
    description: Original ordered paired-electron arrows serialized as JSON.
  mechanism_record_json:
    role: target
    description: Typed supplied mechanism; ordering preserves the source convention.
  verification_level:
    role: quality
    description: EXACT, NORMALIZED or diagnostic DELTA_CONSISTENT source replay tier.
  label_method:
    role: provenance
    description: Upstream expert judgment, positive-record labeling or generated negative
      method; withheld from predictive input.
  additional_note:
    role: provenance
    description: Source expert note or rationale; retained verbatim and withheld from predictive
      input.
  failure_reasons:
    role: provenance
    description: Source failure-reason annotation; not a measured experimental outcome.
  difficulty:
    role: provenance
    description: Source annotated difficulty; withheld from predictive input.
  source_case_id:
    role: identifier
    description: Published SynEPD case identifier, joined by case ID and checked against endpoints
      and arrows.
  source_sqlite_id:
    role: identifier
    description: SynEPD SQLite primary key; distinct from the JSON source ID.
  representation_json:
    role: provenance
    description: Source representation and verification policy serialized as JSON.
  taxonomy_json:
    role: provenance
    description: Source reaction taxonomy serialized as JSON; withheld from mechanism inputs.
  reaction_name:
    role: provenance
    description: Source reaction name; withheld from mechanism inputs.
  overall_reaction_group:
    role: group
    description: Source canonical endpoint reaction hash; a grouping key rather than a physical-mechanism
      identity.
  rc_group:
    role: group
    description: Source reaction-center hash; retained outside model input.
  mc_group:
    role: group
    description: Source mechanistic-center hash; retained outside model input.
  reference_replay_status:
    role: quality
    description: Strict source-arrow replay status under the recorded representation policy;
      not physical mechanism verification.
  source_version:
    role: provenance
    description: Pinned upstream release version.
datasets:
  aam/metambd_cyclic.csv.gz:
    title: MetaMBD cyclic reaction atom mappings
    description: Combined native train and test cases from the local ringreactions archive.
      Train selects the first mapping per source row; test retains full ITS representatives
      within each source row. All original candidates are preserved in a provenance sidecar.
    benchmark_role: Heavy-atom mapping on cyclic reactions using native training and test splits.
    license: Not supplied in the local archive
    license_spdx: LicenseRef-Unknown
    license_url: ''
    redistribution_partition: excluded
    citations: []
    targets:
    - ground_truth
    split_values:
    - train
    - test
    split_column: split
    split_status: source_provided_local_archive
    row_identifier: r_id
    row_identifier_unique: true
    target_kinds:
      ground_truth: heavy_atom_mapping
  aam/brenda.csv.gz:
    title: BRENDA balanced atom mappings
    description: IUBMB-marked, structure-complete, atom- and charge-balanced BRENDA reactions
      mapped with SynKit.
    benchmark_role: Evaluate mapping methods on a conservative biochemical reaction subset
      with computational mapping quality control.
    license: CC BY 4.0
    license_spdx: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    redistribution_partition: main
    citations:
    - hauenstein2026brenda
    targets:
    - ground_truth
    row_identifier: r_id
    row_identifier_unique: true
  aam/flower_e.csv.gz:
    title: FlowER elementary atom mappings
    description: Unique elementary test-set mappings retaining only reacting explicit hydrogens;
      inputs are canonical unmapped SMILES with removable hydrogens made implicit.
    benchmark_role: Evaluate atom mapping on conserved mechanistic elementary steps from the
      corrected May-2026 FlowER test split.
    license: MIT
    license_spdx: MIT
    license_url: https://spdx.org/licenses/MIT.html
    redistribution_partition: main
    citations:
    - joung2025electron
    - fong2026flower_data
    targets:
    - ground_truth
    row_identifier: r_id
    row_identifier_unique: true
  aam/flower_c.csv.gz:
    title: FlowER composite atom mappings
    description: Unique multi-step test-set mappings retaining only reacting explicit hydrogens;
      inputs are canonical unmapped SMILES with removable hydrogens made implicit.
    benchmark_role: Evaluate atom mapping on overall transformations spanning at least two
      elementary transitions.
    license: MIT
    license_spdx: MIT
    license_url: https://spdx.org/licenses/MIT.html
    redistribution_partition: main
    citations:
    - joung2025electron
    - fong2026flower_data
    targets:
    - ground_truth
    row_identifier: r_id
    row_identifier_unique: true
  aam/ehreact.csv.gz:
    title: EHreact atom mappings
    description: Manually corrected atom-mapped reactions from the EHreact manuscript assay
      collection.
    benchmark_role: Evaluate atom mapping and reaction-template methods across nine enzymatic
      and synthetic systems.
    license: BSD-3-Clause
    license_spdx: BSD-3-Clause
    license_url: https://spdx.org/licenses/BSD-3-Clause.html
    redistribution_partition: main
    citations:
    - heid2021ehreact
    targets:
    - ground_truth
    row_identifier: r_id
    row_identifier_unique: true
  aam/ecoli.csv.gz:
    title: E. coli atom mapping
    description: Biochemical atom-mapping benchmark derived from E. coli reactions.
    benchmark_role: Compare mapper outputs with curated biochemical reference mappings.
    license: CC BY 4.0
    license_spdx: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    redistribution_partition: main
    citations:
    - beier2026computing
    targets:
    - ground_truth
    row_identifier: r_id
    row_identifier_unique: true
  aam/enzyme_map.csv.gz:
    title: EnzymeMap atom mapping
    description: Enzymatic atom-mapping benchmark from the EnzymeMap reaction collection.
    benchmark_role: Evaluate atom mapping at scale on enzymatic reactions.
    license: CC BY 4.0
    license_spdx: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    redistribution_partition: main
    citations:
    - heid2023enzymemap
    targets:
    - ground_truth
    row_identifier: r_id
    row_identifier_unique: true
  aam/golden.csv.gz:
    title: Golden atom-mapping set
    description: Curated synthetic-chemistry atom-mapping benchmark.
    benchmark_role: Compare mapper outputs with a curated synthetic reference set.
    license: CC BY 4.0
    license_spdx: CC-BY-4.0
    license_url: https://creativecommons.org/licenses/by/4.0/
    redistribution_partition: main
    citations:
    - chen2024precise
