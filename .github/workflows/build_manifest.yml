name: Release integrity

on:
  push:
    branches: [main, data, dev-new]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -e ".[query]"

      - name: Check release versions
        run: python scripts/check_release.py

      - name: Verify the committed catalogue layout
        run: >-
          python -m synrxn.reconstruction layout verify
          --allow-missing --check-hashes > release-validation.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation
          path: release-validation.json
          if-no-files-found: ignore
