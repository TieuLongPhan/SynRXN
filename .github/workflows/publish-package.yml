name: PyPI publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Validate and build package
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and validation dependencies
        run: python -m pip install -e ".[all,dev]" twine
      - name: Check tag and release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Lint
        run: scripts/lint.sh
      - name: Test portable components
        run: >-
          scripts/pytest.sh -q Test/metrics/test_tasks.py Test/benchmarks/test_protocols.py
          Test/metrics/test_reference.py Test/split Test/io Test/reconstruction/expansion
      - name: Build distributions
        run: python -m build
      - name: Inspect distributions
        run: |
          python scripts/check_release.py --dist-dir dist
          python -m twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/

  publish:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/synrxn
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
