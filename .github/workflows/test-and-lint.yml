name: Test, lint, and package

on:
  push:
    branches: [dev, dev-new, main, fps]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"

      - name: Check release metadata
        run: python scripts/check_release.py

      - name: Lint
        run: scripts/lint.sh

      # Full source/reconstruction tests require the matching external data assets.
      - name: Test metrics, split protocols and evaluation
        run: >-
          scripts/pytest.sh -q Test/metrics/test_tasks.py Test/benchmarks/test_protocols.py
          Test/metrics/test_reference.py Test/split Test/io Test/reconstruction/expansion

      - name: Build wheel and source distribution
        if: matrix.python-version == '3.11'
        run: python -m build

      - name: Check distribution contents
        if: matrix.python-version == '3.11'
        run: python scripts/check_release.py --dist-dir dist

      - name: Inspect built distributions
        if: matrix.python-version == '3.11'
        run: python -m pip install twine && python -m twine check dist/*

      - name: Smoke-test installed wheel
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/synrxn-smoke
          /tmp/synrxn-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/synrxn-smoke/bin/python -c "import synrxn; print(synrxn.DataLoader)"
          /tmp/synrxn-smoke/bin/synrxn --help
